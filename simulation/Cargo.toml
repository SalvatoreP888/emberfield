[package]
name = "emberfield-simulation"
version = "0.1.0"
edition = "2021"
description = "Deterministic, streamed forest and wildfire simulation for Emberfield"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

